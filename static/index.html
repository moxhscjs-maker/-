<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>问卷系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #333; }

    nav {
      background: #4f46e5; color: #fff; display: flex; align-items: center;
      padding: 0 24px; height: 56px; gap: 8px;
    }
    nav h1 { font-size: 18px; font-weight: 600; margin-right: auto; }
    nav button {
      background: rgba(255,255,255,0.15); border: none; color: #fff;
      padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
      transition: background 0.2s;
    }
    nav button:hover, nav button.active { background: rgba(255,255,255,0.3); }

    .page { display: none; max-width: 820px; margin: 32px auto; padding: 0 16px; }
    .page.active { display: block; }

    .card {
      background: #fff; border-radius: 12px; padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px;
    }
    .card h2 { font-size: 16px; margin-bottom: 16px; color: #4f46e5; }

    /* Form */
    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .field input[type=text], .field textarea, .field select {
      width: 100%; padding: 8px 12px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s;
    }
    .field input[type=text]:focus, .field textarea:focus, .field select:focus {
      border-color: #4f46e5;
    }
    .field textarea { height: 80px; resize: vertical; }
    .radio-group, .checkbox-group { display: flex; flex-direction: column; gap: 8px; }
    .radio-group label, .checkbox-group label {
      display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 400;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 20px; border: none; border-radius: 8px;
      font-size: 14px; cursor: pointer; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-secondary { background: #e5e7eb; color: #333; }
    .btn-sm { padding: 4px 12px; font-size: 13px; }
    .btn-success { background: #10b981; color: #fff; }

    /* Question list in manage tab */
    .q-item {
      border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 16px;
      margin-bottom: 12px; display: flex; align-items: flex-start; gap: 12px;
    }
    .q-item-body { flex: 1; }
    .q-item-title { font-weight: 500; margin-bottom: 4px; }
    .q-item-meta { font-size: 12px; color: #6b7280; }
    .q-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .drag-handle { cursor: grab; color: #9ca3af; font-size: 18px; align-self: center; }

    /* Stats */
    .stat-item { margin-bottom: 24px; }
    .stat-title { font-weight: 500; margin-bottom: 10px; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 13px; }
    .bar-label { width: 120px; flex-shrink: 0; text-align: right; color: #4b5563; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; background: #e5e7eb; border-radius: 4px; height: 18px; position: relative; }
    .bar-fill { background: #4f46e5; border-radius: 4px; height: 100%; transition: width 0.4s; }
    .bar-count { width: 40px; text-align: right; color: #6b7280; }
    .text-answers { font-size: 13px; color: #4b5563; background: #f9fafb; border-radius: 8px; padding: 10px 14px; }
    .text-answers p { padding: 4px 0; border-bottom: 1px solid #e5e7eb; }
    .text-answers p:last-child { border-bottom: none; }
    .stat-summary { font-size: 13px; color: #6b7280; margin-bottom: 6px; }

    /* Modal */
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: #fff; border-radius: 14px; padding: 28px;
      width: 520px; max-width: 95vw; max-height: 85vh; overflow-y: auto;
    }
    .modal h3 { font-size: 16px; margin-bottom: 20px; }
    .options-editor { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; }
    .option-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .option-row input { flex: 1; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1f2937; color: #fff; padding: 10px 20px; border-radius: 8px;
      font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 200;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .empty { text-align: center; color: #9ca3af; padding: 40px; font-size: 14px; }

    .required-mark { color: #ef4444; }
  </style>
</head>
<body>

<nav>
  <h1>📋 问卷系统</h1>
  <button class="active" onclick="showPage('survey')">填写问卷</button>
  <button onclick="showPage('manage')">管理题目</button>
  <button onclick="showPage('stats')">统计结果</button>
</nav>

<!-- ===== 填写问卷 ===== -->
<div id="page-survey" class="page active">
  <div class="card">
    <h2>填写问卷</h2>
    <form id="survey-form">
      <div id="survey-questions"><p class="empty">暂无题目，请先在「管理题目」中添加。</p></div>
      <button type="submit" class="btn btn-primary" style="margin-top:8px">提交问卷</button>
    </form>
  </div>
</div>

<!-- ===== 管理题目 ===== -->
<div id="page-manage" class="page">
  <div class="card">
    <h2>管理题目</h2>
    <button class="btn btn-primary" onclick="openAddModal()">＋ 添加题目</button>
  </div>
  <div id="question-list"></div>
</div>

<!-- ===== 统计结果 ===== -->
<div id="page-stats" class="page">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <h2 style="margin-bottom:4px">统计结果</h2>
      <p id="total-label" style="font-size:13px;color:#6b7280;"></p>
    </div>
    <a id="export-btn" href="/api/export" class="btn btn-success">⬇ 导出 CSV</a>
  </div>
  <div id="stats-content"></div>
</div>

<!-- ===== 编辑/新增题目 Modal ===== -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modal-title">添加题目</h3>
    <div class="field">
      <label>题目文字 <span class="required-mark">*</span></label>
      <input type="text" id="q-title" placeholder="请输入题目文字" />
    </div>
    <div class="field">
      <label>题目类型</label>
      <select id="q-type" onchange="onTypeChange()">
        <option value="text">单行文字</option>
        <option value="textarea">多行文字</option>
        <option value="radio">单选题</option>
        <option value="checkbox">多选题</option>
        <option value="select">下拉选择</option>
        <option value="rating">评分（1-5星）</option>
      </select>
    </div>
    <div class="field" id="q-required-field">
      <label><input type="checkbox" id="q-required" style="width:auto;margin-right:6px" />必填</label>
    </div>
    <div class="field" id="options-field" style="display:none">
      <label>选项</label>
      <div class="options-editor">
        <div id="options-list"></div>
        <button type="button" class="btn btn-secondary btn-sm" onclick="addOptionRow()">＋ 添加选项</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-primary" onclick="saveQuestion()">保存</button>
      <button class="btn btn-secondary" onclick="closeModa()">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let questions = [];
let editingId = null;

const TYPE_LABELS = {
  text: "单行文字", textarea: "多行文字", radio: "单选题",
  checkbox: "多选题", select: "下拉选择", rating: "评分"
};

// ---- Navigation ----
function showPage(name) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.getElementById("page-" + name).classList.add("active");
  event.target.classList.add("active");
  if (name === "survey") loadSurvey();
  if (name === "manage") loadManage();
  if (name === "stats") loadStats();
}

// ---- API helpers ----
async function api(url, method = "GET", body = null) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  return r.json();
}

// ---- Toast ----
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// ---- Survey Page ----
async function loadSurvey() {
  questions = await api("/api/questions");
  const container = document.getElementById("survey-questions");
  if (!questions.length) {
    container.innerHTML = '<p class="empty">暂无题目，请先在「管理题目」中添加。</p>';
    return;
  }
  container.innerHTML = questions.map(q => renderSurveyField(q)).join("");
  // rating stars init
  document.querySelectorAll(".star-group").forEach(initStars);
}

function renderSurveyField(q) {
  const req = q.required ? '<span class="required-mark"> *</span>' : "";
  let input = "";
  if (q.type === "text") {
    input = `<input type="text" name="${q.id}" placeholder="请输入" />`;
  } else if (q.type === "textarea") {
    input = `<textarea name="${q.id}" placeholder="请输入"></textarea>`;
  } else if (q.type === "radio") {
    input = `<div class="radio-group">${(q.options||[]).map(o =>
      `<label><input type="radio" name="${q.id}" value="${esc(o)}" />${esc(o)}</label>`).join("")}</div>`;
  } else if (q.type === "checkbox") {
    input = `<div class="checkbox-group">${(q.options||[]).map(o =>
      `<label><input type="checkbox" name="${q.id}" value="${esc(o)}" />${esc(o)}</label>`).join("")}</div>`;
  } else if (q.type === "select") {
    input = `<select name="${q.id}"><option value="">-- 请选择 --</option>${
      (q.options||[]).map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("")}</select>`;
  } else if (q.type === "rating") {
    input = `<div class="star-group" data-name="${q.id}">
      ${[1,2,3,4,5].map(i => `<span class="star" data-val="${i}" style="font-size:28px;cursor:pointer;color:#d1d5db">★</span>`).join("")}
      <input type="hidden" name="${q.id}" value="" />
    </div>`;
  }
  return `<div class="field"><label>${esc(q.title)}${req}</label>${input}</div>`;
}

function initStars(group) {
  const stars = group.querySelectorAll(".star");
  const hidden = group.querySelector("input[type=hidden]");
  stars.forEach(s => {
    s.addEventListener("click", () => {
      const val = +s.dataset.val;
      hidden.value = val;
      stars.forEach(x => x.style.color = +x.dataset.val <= val ? "#f59e0b" : "#d1d5db");
    });
    s.addEventListener("mouseenter", () => {
      const val = +s.dataset.val;
      stars.forEach(x => x.style.color = +x.dataset.val <= val ? "#f59e0b" : "#d1d5db");
    });
  });
  group.addEventListener("mouseleave", () => {
    const val = +hidden.value;
    stars.forEach(x => x.style.color = +x.dataset.val <= val ? "#f59e0b" : "#d1d5db");
  });
}

document.getElementById("survey-form").addEventListener("submit", async e => {
  e.preventDefault();
  const answers = {};
  let valid = true;
  for (const q of questions) {
    const els = document.querySelectorAll(`[name="${q.id}"]`);
    let val = "";
    if (q.type === "checkbox") {
      val = [...els].filter(x => x.checked).map(x => x.value);
      if (q.required && val.length === 0) { toast(`「${q.title}」为必填项`); valid = false; break; }
    } else if (q.type === "radio") {
      const checked = [...els].find(x => x.checked);
      val = checked ? checked.value : "";
      if (q.required && !val) { toast(`「${q.title}」为必填项`); valid = false; break; }
    } else {
      val = els[0]?.value || "";
      if (q.required && !val) { toast(`「${q.title}」为必填项`); valid = false; break; }
    }
    answers[q.id] = val;
  }
  if (!valid) return;
  await api("/api/responses", "POST", answers);
  toast("✅ 问卷提交成功！");
  document.getElementById("survey-form").reset();
  document.querySelectorAll(".star").forEach(s => s.style.color = "#d1d5db");
  document.querySelectorAll(".star-group input[type=hidden]").forEach(h => h.value = "");
});

// ---- Manage Page ----
async function loadManage() {
  questions = await api("/api/questions");
  renderQuestionList();
}

function renderQuestionList() {
  const el = document.getElementById("question-list");
  if (!questions.length) { el.innerHTML = '<div class="empty">暂无题目</div>'; return; }
  el.innerHTML = questions.map((q, i) => `
    <div class="q-item" draggable="true" data-id="${q.id}" data-idx="${i}">
      <span class="drag-handle" title="拖动排序">⠿</span>
      <div class="q-item-body">
        <div class="q-item-title">${i+1}. ${esc(q.title)}</div>
        <div class="q-item-meta">${TYPE_LABELS[q.type] || q.type}${q.required ? " · 必填" : ""}${
          q.options ? " · 选项：" + q.options.join("、") : ""}</div>
      </div>
      <div class="q-item-actions">
        <button class="btn btn-secondary btn-sm" onclick="openEditModal('${q.id}')">编辑</button>
        <button class="btn btn-danger btn-sm" onclick="deleteQuestion('${q.id}')">删除</button>
      </div>
    </div>
  `).join("");
  initDrag();
}

function initDrag() {
  const items = document.querySelectorAll(".q-item");
  let dragging = null;
  items.forEach(item => {
    item.addEventListener("dragstart", () => { dragging = item; item.style.opacity = "0.4"; });
    item.addEventListener("dragend", () => { item.style.opacity = "1"; dragging = null; saveOrder(); });
    item.addEventListener("dragover", e => {
      e.preventDefault();
      if (dragging && dragging !== item) {
        const list = item.parentNode;
        const nodes = [...list.children];
        const draggingIdx = nodes.indexOf(dragging);
        const targetIdx = nodes.indexOf(item);
        if (draggingIdx < targetIdx) list.insertBefore(dragging, item.nextSibling);
        else list.insertBefore(dragging, item);
      }
    });
  });
}

async function saveOrder() {
  const order = [...document.querySelectorAll(".q-item")].map(el => el.dataset.id);
  await api("/api/questions/reorder", "POST", order);
  await loadManage();
}

async function deleteQuestion(id) {
  if (!confirm("确定删除该题目？")) return;
  await api("/api/questions/" + id, "DELETE");
  toast("已删除");
  loadManage();
}

// ---- Modal ----
function openAddModal() {
  editingId = null;
  document.getElementById("modal-title").textContent = "添加题目";
  document.getElementById("q-title").value = "";
  document.getElementById("q-type").value = "text";
  document.getElementById("q-required").checked = false;
  document.getElementById("options-list").innerHTML = "";
  document.getElementById("options-field").style.display = "none";
  document.getElementById("modal-bg").classList.add("open");
}

function openEditModal(id) {
  const q = questions.find(x => x.id === id);
  if (!q) return;
  editingId = id;
  document.getElementById("modal-title").textContent = "编辑题目";
  document.getElementById("q-title").value = q.title;
  document.getElementById("q-type").value = q.type;
  document.getElementById("q-required").checked = !!q.required;
  onTypeChange();
  if (q.options) {
    document.getElementById("options-list").innerHTML = "";
    q.options.forEach(o => addOptionRow(o));
  }
  document.getElementById("modal-bg").classList.add("open");
}

function closeModal(e) { if (e.target === document.getElementById("modal-bg")) closeModa(); }
function closeModa() { document.getElementById("modal-bg").classList.remove("open"); }

function onTypeChange() {
  const type = document.getElementById("q-type").value;
  const show = ["radio", "checkbox", "select"].includes(type);
  document.getElementById("options-field").style.display = show ? "block" : "none";
  if (show && !document.getElementById("options-list").children.length) {
    addOptionRow("选项1"); addOptionRow("选项2");
  }
}

function addOptionRow(val = "") {
  const row = document.createElement("div");
  row.className = "option-row";
  row.innerHTML = `<input type="text" class="option-input" placeholder="选项内容" value="${esc(val)}" />
    <button type="button" class="btn btn-danger btn-sm" onclick="this.parentNode.remove()">×</button>`;
  document.getElementById("options-list").appendChild(row);
}

async function saveQuestion() {
  const title = document.getElementById("q-title").value.trim();
  if (!title) { toast("请输入题目文字"); return; }
  const type = document.getElementById("q-type").value;
  const required = document.getElementById("q-required").checked;
  const q = { title, type, required };
  if (["radio", "checkbox", "select"].includes(type)) {
    const opts = [...document.querySelectorAll(".option-input")].map(i => i.value.trim()).filter(Boolean);
    if (!opts.length) { toast("请至少添加一个选项"); return; }
    q.options = opts;
  }
  if (editingId) {
    await api("/api/questions/" + editingId, "PUT", q);
    toast("已更新");
  } else {
    await api("/api/questions", "POST", q);
    toast("已添加");
  }
  closeModa();
  loadManage();
}

// ---- Stats Page ----
async function loadStats() {
  const data = await api("/api/stats");
  document.getElementById("total-label").textContent = `共收到 ${data.total_responses} 份回答`;
  const el = document.getElementById("stats-content");
  if (!data.questions.length) { el.innerHTML = '<div class="empty">暂无题目</div>'; return; }
  el.innerHTML = data.questions.map(q => renderStat(q)).join("");
}

function renderStat(q) {
  let body = "";
  if (q.counts !== undefined) {
    const entries = Object.entries(q.counts).sort((a, b) => b[1] - a[1]);
    const max = Math.max(...entries.map(e => e[1]), 1);
    body = entries.length ? entries.map(([label, count]) => `
      <div class="bar-row">
        <div class="bar-label" title="${esc(label)}">${esc(label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(count/max*100).toFixed(1)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>`).join("") : "<p style='color:#9ca3af;font-size:13px'>暂无回答</p>";
  } else {
    const ans = (q.answers || []).filter(Boolean);
    body = ans.length ? `<div class="text-answers">${ans.map(a => `<p>${esc(a)}</p>`).join("")}</div>`
      : "<p style='color:#9ca3af;font-size:13px'>暂无回答</p>";
  }
  return `<div class="card stat-item">
    <div class="stat-title">${esc(q.title)}</div>
    <div class="stat-summary">${TYPE_LABELS[q.type] || q.type} · ${q.total} 人回答</div>
    ${body}
  </div>`;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// init
loadSurvey();
</script>
</body>
</html>
